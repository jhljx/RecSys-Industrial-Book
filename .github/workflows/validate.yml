name: Public knowledge and Agent checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction tool
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check published metadata, boundaries, and Skills
        run: |
          python3 tools/check_knowledge.py
          python3 tools/check_public_boundary.py
          python3 tools/check_skills.py
      - name: Check committed knowledge-map data
        run: |
          python3 tools/build_knowledge_map.py
          git diff --exit-code -- knowledge-map/data.js
      - name: Check committed code reading pages
        run: |
          python3 tools/build_code_pages.py
          git diff --exit-code -- knowledge-map/code-data.js knowledge-map/code/
          test -z "$(git ls-files --others --exclude-standard knowledge-map/code-data.js knowledge-map/code/)"
      - name: Check committed static catalog and sitemap
        run: |
          python3 tools/build_search_pages.py
          git diff --exit-code -- knowledge-map/catalog.html sitemap.xml _data/concept_links.json
          test -z "$(git ls-files --others --exclude-standard knowledge-map/catalog.html sitemap.xml _data/concept_links.json)"
      - name: Build local PDF index and enforce retrieval quality (index is required by repository tests)
        run: |
          python3 tools/recsys_agent.py index
          python3 tools/recsys_agent.py doctor
          python3 tools/recsys_agent.py eval --min-hit-at-1 1.0
          python3 tools/recsys_agent.py eval --dataset evals/page-evidence.jsonl
          python3 tools/recsys_agent.py eval --dataset evals/unanswerable.jsonl
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '131.0.6778.85'
      - name: Run repository tests (templates, chapter smoke, routes, browser)
        env:
          RECSYS_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          RECSYS_REQUIRE_BROWSER: '1'
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Check JavaScript syntax
        run: |
          node --check knowledge-map/app.js
          node --check knowledge-map/paper-map.js
          node --check knowledge-map/reader.js
          node --check knowledge-map/code.js
          node --check knowledge-map/document.js
      - name: Test pipeline internals (including deadline degradation)
        run: python3 -m unittest discover -s templates/recommendation-pipeline/tests -p 'test_*.py' -v
